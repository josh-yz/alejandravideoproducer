<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Source for assets/img/og-cover.png (1200x630). Regenerate with:
     "/Applications/Brave Browser.app/Contents/MacOS/Brave Browser" --headless --hide-scrollbars \
       --window-size=1200,630 --screenshot=assets/img/og-cover.png design/og-cover.html -->
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:#0047ab;color:#fff;font-family:Arial,"Helvetica Neue",sans-serif;position:relative}
  .grid{position:absolute;inset:0;background-image:linear-gradient(#ffffff12 1px,transparent 1px),linear-gradient(90deg,#ffffff12 1px,transparent 1px);background-size:60px 60px}
  .top{position:absolute;top:56px;left:64px;display:flex;align-items:center;gap:18px}
  .mark{width:56px;height:56px;border:1px solid #fff9;display:grid;place-items:center;font-weight:700;font-size:20px;letter-spacing:-.05em}
  .label{font-family:"Courier New",monospace;font-size:16px;letter-spacing:.16em}
  h1{position:absolute;left:64px;top:200px;font-size:92px;line-height:.9;letter-spacing:-.075em;font-weight:700}
  h1 em{font-style:normal;color:#dce8ff}
  .tags{position:absolute;left:64px;bottom:64px;font-size:22px;color:#e0e9f8;display:flex;gap:18px}
  .tags span+span:before{content:"•";margin-right:18px;color:#ffffff80}
  .frame{position:absolute;border:1px solid #ffffff8c;overflow:hidden;box-shadow:0 28px 80px #00143c66}
  .frame img{width:100%;height:100%;object-fit:cover;display:block}
  .f1{width:410px;height:240px;right:56px;top:70px;transform:rotate(3deg)}
  .f2{width:320px;height:190px;right:150px;top:350px;transform:rotate(-4deg);z-index:2}
  .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;border:1px solid #fffc;background:#001e5094;display:grid;place-items:center;font-size:18px;padding-left:4px}
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="top"><div class="mark">VP</div><div class="label">ALEJANDRA &nbsp;/&nbsp; VIDEO PRODUCER</div></div>
  <h1>Stories that<br><em>stay with you.</em></h1>
  <div class="tags"><span>Video editing</span><span>AI production</span><span>YouTube</span></div>
  <div class="frame f1"><img src="../assets/img/7dSTtn8gwhM.jpg"><span class="play">▶</span></div>
  <div class="frame f2"><img src="../assets/img/cWhBT4UOHnk.jpg"></div>
</body>
</html>
